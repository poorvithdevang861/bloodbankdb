<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg: #f5f5f3;
            --surface: #ecece8;
            --surface-strong: #e3e3de;
            --border: #d4d4cf;
            --text: #2f2f2c;
            --muted: #5a5a56;
            --accent: #8b1f1f;
            --accent-hover: #7a1b1b;
            --accent-strong: #6b1818;
            --shadow-raised: -6px -6px 14px rgba(255, 255, 255, 0.75), 8px 8px 18px rgba(153, 153, 145, 0.35);
            --shadow-inset: inset 2px 2px 5px rgba(150, 150, 141, 0.3), inset -2px -2px 4px rgba(255, 255, 255, 0.75);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .surface {
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow-raised);
            padding: 28px;
        }

        h2 {
            margin: 0 0 20px;
            text-align: center;
            color: var(--text);
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        h2::after {
            content: "";
            display: block;
            width: 44px;
            height: 3px;
            border-radius: 999px;
            margin: 10px auto 0;
            background: var(--accent);
        }

        .subtitle {
            margin: 0 0 16px;
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .field {
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-strong);
            color: var(--text);
            box-shadow: var(--shadow-inset);
            outline: none;
        }

        input:focus {
            border-color: #b46d6d;
            box-shadow: var(--shadow-inset), 0 0 0 3px rgba(139, 31, 31, 0.15);
        }

        button {
            margin-top: 6px;
            width: 100%;
            border: 1px solid #6f1717;
            border-radius: 10px;
            background: linear-gradient(160deg, #7f1c1c, var(--accent-strong));
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
            font-weight: 600;
            padding: 11px 12px;
            box-shadow: -2px -2px 3px rgba(255, 255, 255, 0.25), 4px 4px 8px rgba(89, 24, 24, 0.32);
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(160deg, var(--accent), var(--accent-strong));
            color: #ffffff;
        }

        button:active {
            transform: translateY(1px);
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.25);
        }

        .hint {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.45;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="surface">
    <h2>Blood Bank Login</h2>
    <p class="subtitle">Access the dashboard to manage donors, requests, and blood stock.</p>
    <form method="POST">
        <div class="field">
            <input name="username" placeholder="Username" required>
        </div>
        <div class="field">
            <input name="password" type="password" placeholder="Password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <p class="hint">
        Demo users: <strong>staff</strong>, <strong>doctor</strong><br>
        Password for all: <strong>123</strong>
    </p>
</div>
</body>
</html>
