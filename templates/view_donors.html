<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor List</title>
    <style>
        :root {
            --bg: #f5f5f3;
            --surface: #ecece8;
            --border: #d4d4cf;
            --text: #2f2f2c;
            --button-text: #1f355e;
            --muted: #5a5a56;
            --accent: #8b1f1f;
            --accent-hover: #7a1b1b;
            --accent-strong: #6b1818;
            --shadow-raised: -7px -7px 14px rgba(255, 255, 255, 0.75), 8px 8px 18px rgba(153, 153, 145, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .page {
            max-width: 700px;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .surface {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow-raised);
            padding: 24px;
        }

        h2 {
            margin: 0 0 18px;
        }

        h2::after {
            content: "";
            display: block;
            margin-top: 8px;
            width: 46px;
            height: 3px;
            border-radius: 999px;
            background: var(--accent);
        }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #f0f0ec;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #ddddda;
        }

        th {
            font-size: 0.9rem;
            color: var(--muted);
            letter-spacing: 0.2px;
            background: #e6e6e1;
        }

        tr:last-child td { border-bottom: none; }

        .action-link, .back-link {
            display: inline-block;
            text-decoration: none;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid #6f1717;
            background: linear-gradient(160deg, #7f1c1c, var(--accent-strong));
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: -1px -1px 3px rgba(255, 255, 255, 0.22), 3px 3px 7px rgba(89, 24, 24, 0.28);
        }

        .action-link:hover {
            background: linear-gradient(160deg, var(--accent), var(--accent-strong));
            color: #ffffff;
        }

        .back-link {
            margin-top: 16px;
            border: 1px solid var(--border);
            background: #e8e8e3;
            color: var(--button-text);
            box-shadow: -2px -2px 4px rgba(255, 255, 255, 0.65), 4px 4px 9px rgba(143, 143, 134, 0.3);
        }

        .back-link:hover {
            color: var(--accent);
            background: #edede9;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="surface">
        <h2>Donor List</h2>
        <div class="table-wrap">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Weight (kg)</th>
                    <th>Blood</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
                {% for d in donors %}
                <tr>
                    <td>{{ d[0] }}</td>
                    <td>{{ d[1] }}</td>
                    <td>{{ d[2] }}</td>
                    <td>{{ d[3] }}</td>
                    <td>{{ d[4] }}</td>
                    <td>{{ d[5] }}</td>
                    <td>{{ d[6] }}</td>
                    <td><a class="action-link" href="/delete/{{ d[0] }}">Delete</a></td>
                </tr>
                {% endfor %}
            </table>
        </div>
        <a class="back-link" href="/">Back</a>
    </div>
</div>
</body>
</html>
